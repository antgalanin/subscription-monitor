spring.application.name=subscription-monitor

# Database (init: psql -U postgres -f init_java.sql)
spring.datasource.url=jdbc:postgresql://localhost:5432/subscription_monitor
spring.datasource.username=subscription_app
spring.datasource.password=Sgj$_tKW0B2N
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate (validate = check Entity matches DB schema)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=on_param

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.subscriptionmonitor=DEBUG
