spring.application.name=subscription-monitor

# Active profile (dev unless SPRING_PROFILES_ACTIVE overrides)
spring.profiles.default=dev

# Database (defaults are for local development only, prod values come from environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/subscription_monitor}
spring.datasource.username=${DB_USERNAME:subscription_app}
spring.datasource.password=${DB_PASSWORD:dev_local_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate (validate = schema is owned by Flyway, Hibernate only checks)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server
server.port=8080

# Session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Actuator (health only, used by container healthchecks)
management.endpoints.web.exposure.include=health
