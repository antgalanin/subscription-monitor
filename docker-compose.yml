# Local development stack
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subscription_monitor
      POSTGRES_USER: subscription_app
      POSTGRES_PASSWORD: dev_local_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription_app -d subscription_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: subscription-monitor-app:latest
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/subscription_monitor
      DB_USERNAME: subscription_app
      DB_PASSWORD: dev_local_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  web:
    build: ./frontend
    image: subscription-monitor-web:latest
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
